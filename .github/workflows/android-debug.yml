name: Android BTR Debug (artifact only)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Debug version name'
        required: true
        default: '0.1.29-btr-debug'
      version_code:
        description: 'Debug versionCode'
        required: true
        default: '20261107'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APKs without release credentials
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: bash ./gradlew --no-daemon assembleDebug "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blbl-btr-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
