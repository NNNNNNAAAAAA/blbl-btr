name: Legacy BTR release entry (moved)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moved:
    runs-on: ubuntu-24.04
    steps:
      - name: Use the isolated release workflow
        run: |
          echo 'This legacy workflow no longer builds, signs, or publishes APKs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run **BTR upstream review and release** with **force=true** for a manual release.' >> "$GITHUB_STEP_SUMMARY"
