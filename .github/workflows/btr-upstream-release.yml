name: BTR upstream review and release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build the current native implementation even without a blbl change (does not bypass legal review)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: btr-upstream-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'NNNNNNAAAAAA/blbl-btr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      metadata_sha256: ${{ steps.prepare.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check trusted release helper tests
        run: python3 -I scripts/test_btr_release.py
      - name: Inspect upstreams and prepare reviewed candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$RELEASE_FORCE" = true ]; then flags+=(--force); fi
          python3 -I scripts/btr_release.py prepare --repo . --out "$RUNNER_TEMP/btr-prepared" --event "$RELEASE_EVENT" "${flags[@]}"
      - name: Save candidate and human-readable BTR report
        if: steps.prepare.outputs.mode != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btr-prepared
          path: ${{ runner.temp }}/btr-prepared/*
          if-no-files-found: error
          retention-days: 14

  unsigned-build:
    needs: prepare
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No release secrets, write token, persisted Git credentials, or shared Gradle cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: btr-prepared
          path: ${{ runner.temp }}/btr-prepared
      - name: Test native acceleration/updater and compile both layouts, then build unsigned APKs
        env:
          PREPARED_METADATA_SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
        run: |
          python3 -I trusted/scripts/btr_release.py build --metadata "$RUNNER_TEMP/btr-prepared/release.json" --bundle "$RUNNER_TEMP/btr-prepared/source.bundle" --work "$RUNNER_TEMP/btr-build-source" --out "$RUNNER_TEMP/btr-unsigned"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btr-unsigned
          path: ${{ runner.temp }}/btr-unsigned/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retain relevant test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btr-test-results
          path: |
            ${{ runner.temp }}/btr-build-source/app/build/test-results/testDebugUnitTest/*.xml
            ${{ runner.temp }}/btr-build-source/app/build/phone/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  sign:
    needs: [prepare, unsigned-build]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official signing tools without release secrets
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: btr-prepared
          path: ${{ runner.temp }}/btr-prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: btr-unsigned
          path: ${{ runner.temp }}/btr-unsigned
      - name: Validate identity and ABI, sign with SDK tools, and hash final APKs
        env:
          PREPARED_METADATA_SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 -I trusted/scripts/btr_release.py sign --metadata "$RUNNER_TEMP/btr-prepared/release.json" --unsigned "$RUNNER_TEMP/btr-unsigned" --out "$RUNNER_TEMP/btr-signed" --tools "$ANDROID_HOME/build-tools/36.0.0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btr-signed
          path: ${{ runner.temp }}/btr-signed/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, unsigned-build, sign]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'report' || needs.sign.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: btr-prepared
          path: ${{ runner.temp }}/btr-prepared
      - if: needs.prepare.outputs.mode == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: btr-signed
          path: ${{ runner.temp }}/btr-signed
      - name: Advance source/state and publish only verified payloads, or record BTR-only report
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_METADATA_SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
        run: |
          python3 -I trusted/scripts/btr_release.py publish --repo trusted --metadata "$RUNNER_TEMP/btr-prepared/release.json" --bundle "$RUNNER_TEMP/btr-prepared/source.bundle" --work "$RUNNER_TEMP/btr-publish-source" --signed "$RUNNER_TEMP/btr-signed"

